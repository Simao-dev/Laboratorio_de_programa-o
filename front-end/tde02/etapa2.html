<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Inscrição - Educação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        S.I sistemas
    </header>

    <div class="card-form">
        <div class="etapas">
            <div class="etapa-item concluida">
                <div class="circulo"></div>
                <span>Dados Pessoais</span>
            </div>
            <div class="linha-etapa concluida"></div>
            <div class="etapa-item ativa">
                <div class="circulo">2</div>
                <span>Educação</span>
            </div>
            <div class="linha-etapa"></div>
            <div class="etapa-item">
                <div class="circulo">3</div>
                <span>Experiência</span>
            </div>
        </div>

        <h2 class="form-titulo">Educação</h2>
        <p class="form-subtitulo">Informe sua formação acadêmica mais recente.</p>

        <form action="etapa3.html" >
            <div class="form-row">
                <div class="form-group">
                    <label>Nível de escolaridade <span>*</span></label>
                    <select required>
                        <option value="">Selecione...</option>
                        <option value="Ensino Médio">Ensino Médio</option>
                        <option value="Ensino Técnico">Ensino Técnico</option>
                        <option value="Ensino Superior">Ensino Superior</option>
                        <option value="Pós-graduação">Pós-graduação</option>
                        <option value="Mestrado">Mestrado</option>
                        <option value="Doutorado">Doutorado</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Ano de conclusão <span>*</span></label>
                    <select required>
                        <option value="">Selecione...</option>
                        <option value="2026">2026</option>
                        <option value="2025">2025</option>
                        <option value="2024">2024</option>
                        <option value="2023">2023</option>
                        <option value="2022">2022</option>
                        <option value="2021">2021</option>
                        <option value="2020">2020</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Nome da instituição <span>*</span></label>
                <input type="text" placeholder="Ex: Faculdade Paraíso (FAP)" required>
            </div>

            <div class="form-group">
                <label>Curso / Área de formação <span>*</span></label>
                <input type="text" placeholder="Ex: Análise e Desenvolvimento de Sistemas" required>
            </div>

            <div class="form-botoes">
                <a href="etapa1.html" class="btn-voltar"> Voltar</a>
                <button type="submit" class="btn-proximo">Próxima etapa</button>
            </div>
        </form>
    </div>

</body>
</html>
